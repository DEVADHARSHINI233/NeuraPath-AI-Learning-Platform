version: "3.9"

services:
  backend:
    build: ./backend
    container_name: neurapath-backend
    ports:
      - "5000:5000"
    environment:
      - SECRET_KEY=change-this-in-production
      - FLASK_DEBUG=0
    volumes:
      - backend_data:/app/uploads
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: neurapath-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data:
